<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006847">
  <title>Radio México • En vivo</title>
  <style>
    :root {
      color-scheme: dark;
      --verde: #00a86b;
      --verde-oscuro: #006847;
      --blanco: #f8fffc;
      --rojo: #e63641;
      --rojo-oscuro: #9f1721;
      --oro: #f1bd4b;
      --crema: #fff3cf;
      --tinta: #fff9e8;
      --suave: rgba(255, 239, 199, .76);
      --cristal: rgba(5, 18, 16, .76);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
      background-color: #050b13;
      background-image:
        linear-gradient(rgba(2, 8, 18, .22), rgba(2, 8, 18, .42)),
        url("https://xatimg.com/image/sqiSvn8iSoxC.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--tinta);
    }

    button, input { font: inherit; }

    .radio {
      isolation: isolate;
      position: relative;
      width: min(100%, 560px);
      min-height: 238px;
      padding: 24px;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 24px;
      background:
        linear-gradient(115deg, rgba(0,104,71,.17), rgba(255,247,219,.045) 47%, rgba(206,17,38,.15)) padding-box;
      box-shadow: inset 0 1px 0 rgba(255,244,211,.15);
      backdrop-filter: blur(4px) brightness(.7) saturate(.82);
      -webkit-backdrop-filter: blur(4px) brightness(.7) saturate(.82);
      text-shadow: 0 2px 9px rgba(0,0,0,.78);
    }

    .radio::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 2px;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--verde) 0 33.333%, #fff 33.333% 66.666%, var(--rojo) 66.666%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 10;
    }

    .radio::after {
      content: "";
      position: absolute;
      top: -40%;
      bottom: -40%;
      left: -26%;
      width: 13%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
      transform: rotate(18deg);
      animation: barrido 7s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }

    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      opacity: .45;
      background: #fff;
      box-shadow: 0 0 12px currentColor;
      animation: flotar 5s ease-in-out infinite;
      pointer-events: none;
    }
    .spark.s1 { left: 7%; top: 20%; color: var(--verde); }
    .spark.s2 { right: 10%; bottom: 18%; color: var(--rojo); animation-delay: -2.1s; }
    .spark.s3 { left: 46%; bottom: 9%; width: 3px; height: 3px; animation-delay: -3.4s; }
    .spark.s4 { left: 25%; top: 8%; width: 4px; height: 4px; color: #fff; animation-delay: -1.3s; }
    .spark.s5 { right: 27%; top: 13%; color: var(--verde); animation-delay: -4.1s; }

    .papel {
      position: absolute;
      top: 7px;
      left: 50%;
      display: flex;
      gap: 4px;
      width: 132px;
      height: 13px;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 3;
    }
    .papel::before {
      content: "";
      position: absolute;
      top: 0;
      left: -4px;
      right: -4px;
      height: 1px;
      background: rgba(241,189,75,.55);
    }
    .papel i {
      flex: 1;
      height: 10px;
      transform-origin: 50% 0;
      clip-path: polygon(0 0, 100% 0, 100% 72%, 50% 100%, 0 72%);
      animation: banderin 3.2s ease-in-out infinite alternate;
    }
    .papel i:nth-child(3n+1) { background: var(--verde); }
    .papel i:nth-child(3n+2) { background: rgba(255,255,255,.9); animation-delay: -.8s; }
    .papel i:nth-child(3n) { background: var(--rojo); animation-delay: -1.6s; }

    .topline, .main, .bottom { position: relative; z-index: 3; }

    }

    .white-rose {
      position: absolute;
      color: rgba(255,255,255,.92);
      font-family: Georgia, serif;
      font-size: 20px;
      line-height: 1;
      opacity: 0;
      text-shadow: 0 0 5px #fff, 0 0 13px rgba(255,255,255,.65);
      animation: rosa-blanca 5.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }
    .rose1 { right: 8%; top: 18%; animation-delay: -.4s; }
    .rose2 { right: 24%; top: 34%; font-size: 15px; animation-delay: -2.2s; }
    .rose3 { right: 10%; bottom: 15%; font-size: 17px; animation-delay: -3.8s; }
    .rose4 { right: 29%; bottom: 19%; font-size: 13px; animation-delay: -1.3s; }
    .rose5 { right: 18%; top: 8%; font-size: 12px; animation-delay: -4.5s; }

    .fiesta-particle {
      position: absolute;
      display: block;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: fiesta-flota 6s ease-in-out infinite;
    }
    .fiesta-particle.note { font-family: Georgia, serif; font-size: 18px; font-weight: 900; text-shadow: 0 0 8px currentColor; }
    .fiesta-particle.taco { font-size: 15px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
    .f1 { left: 16%; bottom: 15%; color: var(--verde); animation-delay: -1s; }
    .f2 { left: 46%; top: 20%; color: var(--oro); animation-delay: -3.3s; }
    .f3 { right: 18%; bottom: 13%; color: var(--rojo); animation-delay: -4.8s; }
    .f4 { right: 33%; top: 15%; animation-delay: -2.2s; }
    .f5 { left: 34%; bottom: 8%; animation-delay: -5.4s; }

    .glint {
      position: absolute;
      width: 14px;
      height: 14px;
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      animation: destello 3.2s ease-in-out infinite;
    }
    .glint::before, .glint::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
      transform: translate(-50%, -50%);
    }
    .glint::before { width: 2px; height: 100%; }
    .glint::after { width: 100%; height: 2px; }
    .g1 { left: 8%; top: 22%; color: var(--verde); animation-delay: -.4s; }
    .g2 { right: 9%; top: 31%; color: #fff; animation-delay: -1.7s; }
    .g3 { left: 57%; top: 12%; color: var(--oro); animation-delay: -2.6s; }
    .g4 { right: 26%; bottom: 12%; color: var(--rojo); animation-delay: -1.1s; }
    .g5 { left: 31%; bottom: 20%; color: #fff; animation-delay: -3s; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .seal {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      width: 42px;
      height: 38px;
      perspective: 70px;
    }
    .flag-large {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 31px;
      height: 20px;
      margin-left: 7px;
      border-radius: 2px 4px 4px 2px;
      box-shadow: 0 4px 9px rgba(0,0,0,.38);
      transform-origin: 0 50%;
      animation: bandera-grande 1.25s ease-in-out infinite alternate;
    }
    .flag-large::before {
      content: "";
      position: absolute;
      left: -4px;
      top: -5px;
      width: 2px;
      height: 33px;
      border-radius: 3px;
      background: linear-gradient(90deg, #8b6843, #e5c592, #76502d);
      box-shadow: 0 2px 5px rgba(0,0,0,.4);
    }
    .flag-large::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 6px;
      border-radius: 55% 45% 55% 45%;
      background: #8b6238;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(0,104,71,.55);
    }
    .flag-large i:first-child { background: #006847; border-radius: 2px 0 0 2px; }
    .flag-large i:nth-child(2) { background: #fff; }
    .flag-large i:last-child { background: #ce1126; border-radius: 0 4px 4px 0; }

    .brand-copy { min-width: 0; }
    .brand-name {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: clamp(16px, 4vw, 19px);
      font-weight: 800;
      letter-spacing: .015em;
      line-height: 1.05;
      font-family: Georgia, Cambria, "Times New Roman", serif;
    }
    .brand-tagline {
      margin: 4px 0 0;
      color: var(--suave);
      font-size: clamp(7px, 1.65vw, 9px);
      font-weight: 650;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(255,225,169,.18);
      border-radius: 999px;
      color: rgba(255,255,255,.82);
      background: linear-gradient(135deg, rgba(206,17,38,.2), rgba(241,189,75,.08));
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--rojo);
      box-shadow: 0 0 0 0 rgba(230,54,65,.65);
      animation: pulso 1.8s ease-out infinite;
    }

    .main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }

    .play {
      position: relative;
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--verde), #087d5a 49%, var(--rojo) 51%, #b8212a);
      box-shadow: 0 0 0 3px rgba(255,255,255,.2), inset 0 1px 1px rgba(255,255,255,.28);
      transition: transform .2s ease, filter .2s ease;
    }
    .cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      z-index: 0;
    }
    .play::before {
      content: "";
      position: absolute;
      inset: -7px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: inherit;
      transition: inset .25s ease, opacity .25s ease;
    }
    .play::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(0,0,0,.28);
      box-shadow: inset 0 0 20px rgba(0,0,0,.22);
      z-index: 1;
      pointer-events: none;
    }
    .play:hover { transform: translateY(-2px) scale(1.025); filter: brightness(1.08); }
    .play:hover::before { inset: -10px; opacity: .7; }
    .play:active { transform: scale(.96); }
    .play:focus-visible, .mute:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .play svg { position: relative; width: 27px; height: 27px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.65)); z-index: 2; }
    .play .pause-icon { display: none; }
    .radio.playing .play .play-icon { display: none; }
    .radio.playing .play .pause-icon { display: block; }
    .radio.playing .play {
      box-shadow: 0 0 0 3px rgba(255,255,255,.28), 0 0 25px rgba(230,54,65,.3), inset 0 1px 1px rgba(255,255,255,.28);
    }
    .radio.playing .play::before { animation: onda 1.7s ease-out infinite; }

    .track { min-width: 0; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 6px;
      color: rgba(255,255,255,.56);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .eq {
      display: flex;
      align-items: end;
      gap: 2px;
      width: 18px;
      height: 11px;
    }
    .eq i {
      display: block;
      width: 2px;
      height: 25%;
      border-radius: 3px;
      background: var(--verde);
    }
    .radio.playing .eq i { animation: ecualizar .7s ease-in-out infinite alternate; }
    .radio.playing .eq i:nth-child(2) { animation-delay: -.38s; background: #fff; }
    .radio.playing .eq i:nth-child(3) { animation-delay: -.18s; background: var(--rojo); }
    .radio.playing .eq i:nth-child(4) { animation-delay: -.52s; }

    .song {
      margin: 0;
      overflow: hidden;
      color: #fff;
      font-size: clamp(17px, 4.4vw, 22px);
      font-weight: 780;
      letter-spacing: -.025em;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 14px;
      margin: 8px 0 0;
      color: rgba(255,255,255,.94);
      font-size: 11px;
      font-weight: 600;
    }
    .meta span { display: inline-flex; align-items: center; gap: 5px; }
    .meta svg { width: 13px; height: 13px; opacity: .8; }

    .bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      margin-top: 21px;
      padding-top: 16px;
      border-top: 1px dashed rgba(241,189,75,.25);
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mute {
      display: grid;
      place-items: center;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      color: rgba(255,255,255,.75);
      cursor: pointer;
      background: rgba(255,255,255,.055);
      transition: color .2s ease, background .2s ease;
    }
    .mute:hover { color: #fff; background: rgba(255,255,255,.1); }
    .mute svg { width: 16px; height: 16px; }
    .mute .off { display: none; }
    .mute.muted .on { display: none; }
    .mute.muted .off { display: block; }

    .slider {
      --nivel: 75%;
      width: min(190px, 100%);
      height: 18px;
      margin: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
    }
    .slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--verde) 0 var(--nivel), rgba(255,255,255,.15) var(--nivel));
    }
    .slider::-moz-range-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.15); }
    .slider::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--verde); }
    .slider::-webkit-slider-thumb {
      width: 13px;
      height: 13px;
      margin-top: -4.5px;
      border: 2px solid rgba(255,255,255,.88);
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--verde-oscuro);
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .slider::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; background: var(--verde-oscuro); }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: rgba(255,255,255,.48);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #8ca29b; transition: background .2s ease, box-shadow .2s ease; }
    .radio.playing .status-dot { background: #30d99a; box-shadow: 0 0 8px rgba(48,217,154,.7); }
    .radio.error .status-dot { background: var(--rojo); box-shadow: 0 0 8px rgba(230,54,65,.7); }

    .bottom-right { display: flex; align-items: center; justify-content: flex-end; gap: 11px; }
    .history-button, .history-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(255,228,171,.16);
      border-radius: 9px;
      color: rgba(255,255,255,.75);
      cursor: pointer;
      background: rgba(98,62,24,.16);
      font-size: 10px;
      font-weight: 750;
      transition: color .2s ease, background .2s ease, transform .2s ease;
    }
    .history-button:hover, .history-close:hover { color: #fff; background: rgba(255,255,255,.12); transform: translateY(-1px); }
    .history-button:focus-visible, .history-close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .history-button svg { width: 13px; height: 13px; }

    .history-panel {
      position: absolute;
      inset: 5px 0 0;
      display: flex;
      flex-direction: column;
      padding: 21px 24px 18px;
      border-radius: 24px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(.985);
      color: #fff;
      background:
        radial-gradient(circle at 8% 10%, rgba(0,168,107,.23), transparent 32%),
        radial-gradient(circle at 92% 90%, rgba(230,54,65,.2), transparent 34%),
        rgba(4,18,15,.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: opacity .25s ease, transform .25s ease, visibility .25s;
      z-index: 20;
    }
    .radio.history-open .history-panel { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .history-title { margin: 0; font-size: 16px; font-weight: 820; letter-spacing: -.01em; }
    .history-title span { color: var(--verde); }
    .history-close { width: 30px; padding: 0; font-size: 18px; line-height: 1; }
    .history-list {
      counter-reset: canciones;
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0 5px 0 0;
      overflow-y: auto;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: var(--verde) rgba(255,255,255,.08);
    }
    .history-list li {
      counter-increment: canciones;
      display: grid;
      grid-template-columns: 23px minmax(0, 1fr);
      align-items: center;
      min-height: 27px;
      padding: 4px 8px;
      border-radius: 8px;
      color: rgba(255,255,255,.76);
      background: rgba(255,255,255,.035);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-list li::before {
      content: counter(canciones, decimal-leading-zero);
      color: var(--verde);
      font-size: 9px;
      font-weight: 850;
    }

    @keyframes pulso {
      70% { box-shadow: 0 0 0 7px rgba(230,54,65,0); }
      100% { box-shadow: 0 0 0 0 rgba(230,54,65,0); }
    }
    @keyframes ecualizar { from { height: 25%; } to { height: 100%; } }
    @keyframes flotar { 0%, 100% { transform: translateY(0); opacity: .25; } 50% { transform: translateY(-10px); opacity: .65; } }
    @keyframes banderin { from { transform: rotate(-3deg) scaleY(.92); } to { transform: rotate(3deg) scaleY(1.04); } }
    @keyframes barrido { 0%, 12% { left: -26%; opacity: 0; } 28% { opacity: 1; } 55%, 100% { left: 115%; opacity: 0; } }
    @keyframes destello { 0%, 72%, 100% { opacity: 0; transform: scale(.25) rotate(0); } 82% { opacity: .9; transform: scale(1) rotate(45deg); } 91% { opacity: .35; transform: scale(.65) rotate(90deg); } }
    @keyframes respirar { 0%, 100% { transform: scale(.97) rotate(-1deg); opacity: .34; } 50% { transform: scale(1.03) rotate(1deg); opacity: .5; } }
    @keyframes rosa-blanca {
      0%, 100% { transform: translate(0, 8px) scale(.35) rotate(-12deg); opacity: 0; }
      24% { opacity: .82; }
      55% { transform: translate(-8px, -4px) scale(1) rotate(5deg); opacity: .68; }
      82% { transform: translate(-14px, -17px) scale(.72) rotate(18deg); opacity: .18; }
    }
    @keyframes fiesta-flota {
      0% { transform: translateY(8px) rotate(-8deg) scale(.8); opacity: 0; }
      22%, 72% { opacity: .55; }
      100% { transform: translateY(-28px) rotate(12deg) scale(1.08); opacity: 0; }
    }
    @keyframes onda { 0% { inset: -7px; opacity: .75; } 100% { inset: -17px; opacity: 0; } }
    @keyframes bandera-grande {
      0% { transform: rotateY(-13deg) skewY(-2deg) translateX(0); filter: brightness(.92); }
      50% { transform: rotateY(7deg) skewY(2deg) translateX(1px); filter: brightness(1.08); }
      100% { transform: rotateY(-7deg) skewY(-1deg) translateX(0); filter: brightness(1); }
    }

    @media (max-width: 430px) {
      body { padding: 8px; }
      .radio { padding: 20px 17px; border-radius: 22px; }
      .topline { margin-bottom: 17px; }
      .main { gap: 14px; }
      .play { width: 62px; height: 62px; }
      .bottom { gap: 10px; margin-top: 18px; }
      .status-label { display: none; }
      .bottom-right { gap: 6px; }
      .history-button { padding: 0 8px; }
      .brand-tagline { letter-spacing: .1em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="radio" id="radioPlayer" aria-label="Reproductor de Radio México">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span>
    <span class="papel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="fiesta-particle note f1" aria-hidden="true">♪</span>
    <span class="fiesta-particle note f2" aria-hidden="true">♫</span>
    <span class="fiesta-particle note f3" aria-hidden="true">♪</span>
    <span class="fiesta-particle taco f4" aria-hidden="true">🌮</span>
    <span class="fiesta-particle taco f5" aria-hidden="true">🌮</span>
    <span class="glint g1" aria-hidden="true"></span><span class="glint g2" aria-hidden="true"></span><span class="glint g3" aria-hidden="true"></span><span class="glint g4" aria-hidden="true"></span><span class="glint g5" aria-hidden="true"></span>
    <span class="catrina-photo" aria-hidden="true"></span>
    <span class="white-rose rose1" aria-hidden="true">✿</span><span class="white-rose rose2" aria-hidden="true">❀</span><span class="white-rose rose3" aria-hidden="true">✿</span><span class="white-rose rose4" aria-hidden="true">❀</span><span class="white-rose rose5" aria-hidden="true">✿</span>

    <div class="topline">
      <div class="brand">
        <div class="seal" aria-hidden="true">
          <span class="flag-large"><i></i><i></i><i></i></span>
        </div>
        <div class="brand-copy">
          <h1 class="brand-name">Radio México</h1>
          <p class="brand-tagline">MUSICA 😎👍 JUEGOS ⚡⚽ Y DIVERSION🥳😋</p>
        </div>
      </div>
      <div class="live"><span class="live-dot"></span>En vivo</div>
    </div>

    <div class="main">
      <button class="play" id="playButton" type="button" aria-label="Reproducir radio" title="Reproducir">
        <img class="cover" id="coverArt" alt="" referrerpolicy="no-referrer">
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.3v13.4c0 .8.9 1.3 1.6.8l9.2-6.7c.6-.4.6-1.2 0-1.6L9.6 4.5c-.7-.5-1.6 0-1.6.8Z"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5.5A1.5 1.5 0 0 1 8.5 4h1A1.5 1.5 0 0 1 11 5.5v13A1.5 1.5 0 0 1 9.5 20h-1A1.5 1.5 0 0 1 7 18.5v-13Zm6 0A1.5 1.5 0 0 1 14.5 4h1A1.5 1.5 0 0 1 17 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-13Z"/></svg>
      </button>

      <section class="track" aria-live="polite">
        <div class="eyebrow"><span class="eq"><i></i><i></i><i></i><i></i></span>Sonando ahora</div>
        <h2 class="song" id="songTitle" title="Cargando información…">Cargando información…</h2>
        <p class="meta">
          <span title="Oyentes conectados">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <b id="listeners">--</b> oyentes
          </span>
          <span title="Calidad de transmisión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
            <b id="bitrate">128</b> kbps
          </span>
          <span id="djWrap" title="Locutor al aire">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
            <b id="djName">Radio México</b>
          </span>
        </p>
      </section>
    </div>

    <div class="bottom">
      <div class="volume">
        <button class="mute" id="muteButton" type="button" aria-label="Silenciar" title="Silenciar">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m11 5-5 4H2v6h4l5 4V5ZM23 9l-6 6M17 9l6 6"/></svg>
        </button>
        <input class="slider" id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Volumen">
      </div>
      <div class="bottom-right">
        <button class="history-button" id="historyButton" type="button" aria-expanded="false" aria-controls="historyPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
          Historial
        </button>
        <div class="status"><span class="status-dot"></span><span class="status-label" id="statusText">Listo para escuchar</span></div>
      </div>
    </div>

    <audio id="audio" preload="auto" autoplay src="https://technoplayerserver.net/8042/stream"></audio>

    <section class="history-panel" id="historyPanel" aria-hidden="true" aria-label="Historial de canciones">
      <div class="history-head">
        <h2 class="history-title"><span>Últimas</span> canciones</h2>
        <button class="history-close" id="historyClose" type="button" aria-label="Cerrar historial">×</button>
      </div>
      <ol class="history-list" id="historyList"><li>Cargando historial…</li></ol>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const STREAM_URL = 'https://technoplayerserver.net/8042/stream';
      const INFO_URL = 'https://technoplayerserver.net/cp/get_info.php?p=8042';
      const radio = document.getElementById('radioPlayer');
      const audio = document.getElementById('audio');
      const playButton = document.getElementById('playButton');
      const muteButton = document.getElementById('muteButton');
      const slider = document.getElementById('volumeSlider');
      const songTitle = document.getElementById('songTitle');
      const coverArt = document.getElementById('coverArt');
      const listeners = document.getElementById('listeners');
      const bitrate = document.getElementById('bitrate');
      const djName = document.getElementById('djName');
      const djWrap = document.getElementById('djWrap');
      const statusText = document.getElementById('statusText');
      const historyButton = document.getElementById('historyButton');
      const historyClose = document.getElementById('historyClose');
      const historyPanel = document.getElementById('historyPanel');
      const historyList = document.getElementById('historyList');
      let lastVolume = Number(slider.value);
      let retryTimer;
      let wantsPlayback = false;

      function setStatus(text, state = '') {
        statusText.textContent = text;
        radio.classList.toggle('error', state === 'error');
      }

      function syncPlaybackUI() {
        const playing = !audio.paused && !audio.ended;
        radio.classList.toggle('playing', playing);
        playButton.setAttribute('aria-label', playing ? 'Pausar radio' : 'Reproducir radio');
        playButton.title = playing ? 'Pausar' : 'Reproducir';
        if (playing) setStatus('Transmitiendo en vivo');
      }

      async function togglePlayback() {
        clearTimeout(retryTimer);
        if (!audio.paused) {
          wantsPlayback = false;
          audio.pause();
          setStatus('Reproducción pausada');
          return;
        }

        setStatus('Conectando…');
        wantsPlayback = true;
        if (!audio.src) audio.src = STREAM_URL;
        try {
          await audio.play();
        } catch (error) {
          wantsPlayback = false;
          setStatus('Toca play para reintentar', 'error');
        }
      }

      async function attemptAutoplay() {
        wantsPlayback = true;
        setStatus('Conectando automáticamente…');
        try {
          await audio.play();
        } catch (error) {
          wantsPlayback = false;
          setStatus('Toca para activar la música');
        }
      }

      function syncVolume() {
        const value = Number(slider.value);
        audio.volume = value;
        audio.muted = value === 0;
        if (value > 0) lastVolume = value;
        slider.style.setProperty('--nivel', `${value * 100}%`);
        muteButton.classList.toggle('muted', audio.muted);
        muteButton.setAttribute('aria-label', audio.muted ? 'Activar sonido' : 'Silenciar');
        muteButton.title = audio.muted ? 'Activar sonido' : 'Silenciar';
      }

      function toggleMute() {
        if (audio.muted || Number(slider.value) === 0) {
          slider.value = String(lastVolume || .75);
        } else {
          lastVolume = Number(slider.value);
          slider.value = '0';
        }
        syncVolume();
      }

      function setHistory(open) {
        radio.classList.toggle('history-open', open);
        historyButton.setAttribute('aria-expanded', String(open));
        historyPanel.setAttribute('aria-hidden', String(!open));
        if (open) historyClose.focus();
        else historyButton.focus();
      }

      function renderHistory(items) {
        historyList.replaceChildren();
        const songs = Array.isArray(items) ? items.slice(0, 12) : [];
        if (!songs.length) songs.push('Historial no disponible');
        songs.forEach(item => {
          const parsed = new DOMParser().parseFromString(String(item), 'text/html');
          const clean = (parsed.body.textContent || '')
            .replace(/^\s*\d+\.\)\s*/, '')
            .replace(/%radiomexico/gi, 'Radio México')
            .trim();
          if (!clean) return;
          const li = document.createElement('li');
          li.textContent = clean;
          li.title = clean;
          historyList.appendChild(li);
        });
      }

      async function updateMetadata() {
        try {
          const response = await fetch(`${INFO_URL}&_=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const title = String(data.title || 'Radio México en vivo')
            .replace(/%radiomexico/gi, 'Radio México')
            .replace(/\s+-\s+-\s+/g, ' - ')
            .trim();

          songTitle.textContent = title;
          songTitle.title = title;
          listeners.textContent = data.listeners ?? data.ulistener ?? '--';
          bitrate.textContent = data.bitrate || '128';
          const dj = String(data.djusername || '').trim();
          djName.textContent = dj || 'Radio México';
          djWrap.hidden = false;
          const art = String(data.art || data.djprofile || '').trim();
          if (art) coverArt.src = art;
          renderHistory(data.history);
          document.title = `${title} • Radio México`;
        } catch (error) {
          if (songTitle.textContent === 'Cargando información…') {
            songTitle.textContent = 'Radio México en vivo';
            songTitle.title = 'Radio México en vivo';
          }
        }
      }

      playButton.addEventListener('click', togglePlayback);
      document.addEventListener('click', event => {
        if (event.target.closest('#playButton') || !audio.paused) return;
        attemptAutoplay();
      }, { once: true });
      coverArt.addEventListener('error', () => coverArt.removeAttribute('src'));
      muteButton.addEventListener('click', toggleMute);
      historyButton.addEventListener('click', () => setHistory(true));
      historyClose.addEventListener('click', () => setHistory(false));
      slider.addEventListener('input', syncVolume);
      audio.addEventListener('play', syncPlaybackUI);
      audio.addEventListener('pause', syncPlaybackUI);
      audio.addEventListener('playing', () => setStatus('Transmitiendo en vivo'));
      audio.addEventListener('waiting', () => setStatus('Cargando señal…'));
      audio.addEventListener('stalled', () => setStatus('Reconectando…'));
      audio.addEventListener('error', () => {
        radio.classList.remove('playing');
        setStatus('Señal interrumpida', 'error');
        clearTimeout(retryTimer);
        retryTimer = setTimeout(() => {
          if (wantsPlayback) {
            audio.src = `${STREAM_URL}?_=${Date.now()}`;
            audio.play().catch(() => setStatus('Toca play para reintentar', 'error'));
          }
        }, 4000);
      });

      syncVolume();
      updateMetadata();
      attemptAutoplay();
      setInterval(updateMetadata, 15000);
    })();
  </script>
</body>
</html>
